name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Unit Test (User Service)
        run: |
          cd user-service
          mvn clean test
        
      - name: Static Code Analysis (SonarQube)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Only runs if secrets are configured
          if [ ! -z "$SONAR_TOKEN" ]; then
            mvn -B verify sonar:sonar -Dsonar.projectKey=placement-syndicate-user-service
          else
            echo "SonarQube secrets not found. Skipping scan."
          fi

      - name: Dependency Check (SCA)
        run: |
          cd user-service
          mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
        continue-on-error: true

  docker-security:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image (User Service)
        run: |
          docker build -t placement-syndicate-user-service ./user-service

      - name: Container Image Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'placement-syndicate-user-service'
          format: 'table'
          exit-code: '0' # Set to 1 to fail build on high severity
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    needs: docker-security
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Staging Deployment
        run: |
          echo "Deploying to Staging Environment..."
          # In a real scenario, this would use 'ssh' or 'kubectl'
          echo "Deployment successful!"

      - name: Smoke Test
        run: |
          echo "Running Smoke Tests..."
          # curl -f http://staging-url/health || exit 1
          echo "Smoke tests passed!"
